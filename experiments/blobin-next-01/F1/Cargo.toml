[package]
name = "blobin-f1-cleanroom"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = "=0.4.0"
png = "=0.18.1"
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
